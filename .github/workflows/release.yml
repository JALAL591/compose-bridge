name: Release - Build & Publish Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. Verify Tests Before Release
  # =========================================================================
  test-server:
    name: Verify Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run Test Suite
        env:
          PYTHONPATH: server
        run: |
          python -m unittest discover -s server/tests -p "test_*.py"

  # =========================================================================
  # 2. Build IntelliJ / Android Studio Plugin
  # =========================================================================
  build-plugin:
    name: Build IntelliJ Plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android Studio Distribution
        id: cache-android-studio
        uses: actions/cache@v4
        with:
          path: /opt/android-studio
          key: android-studio-2024.1.2.13-linux

      - name: Download & Extract Android Studio (if not cached)
        if: steps.cache-android-studio.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/android-studio
          curl -fSL "https://redirector.gvt1.com/edgedl/android/studio/ide-zips/2024.1.2.13/android-studio-2024.1.2.13-linux.tar.gz" | sudo tar -xz --strip-components=1 -C /opt/android-studio

      - name: Grant Execute Permission for Gradlew
        run: chmod +x plugin/gradlew

      - name: Build Plugin Distribution
        working-directory: plugin
        env:
          ANDROID_STUDIO_HOME: /opt/android-studio
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: plugin/build/distributions/ComposeBridgeIntelliJ-*.zip
          retention-days: 1

  # =========================================================================
  # 3. Build Android Agent AARs
  # =========================================================================
  build-agent:
    name: Build Android Agent AARs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x agent/gradlew

      - name: Assemble Release AARs
        working-directory: agent
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Agent AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-aars
          path: |
            agent/build/outputs/aar/composebridge-agent-release.aar
            agent/runtime/build/outputs/aar/composebridge-runtime-release.aar
          retention-days: 1

  # =========================================================================
  # 4. Package Bundles and Publish to GitHub Release
  # =========================================================================
  publish-release:
    name: Package Assets & Publish Release
    needs: [test-server, build-plugin, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Plugin Artifact
        uses: actions/download-artifact@v4
        with:
          name: intellij-plugin
          path: dist-staging

      - name: Download Agent AARs
        uses: actions/download-artifact@v4
        with:
          name: android-agent-aars
          path: dist-staging

      - name: Package Release Assets & AllInOne Bundle
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "Packaging release for tag: ${TAG_NAME} (version: ${VERSION})"

          mkdir -p dist/docs
          cp dist-staging/*.zip dist/ || true
          cp dist-staging/*.aar dist/ || true

          # Package Server distribution ZIP (excluding temporary / cache files)
          zip -r "dist/composebridge-server-${VERSION}.zip" server/ \
            -x "server/**/__pycache__/*" \
            -x "server/**/*.pyc" \
            -x "server/**/*.bak_arch" \
            -x "server/**/*.bridge.bak" \
            -x "server/.composebridge-state/events.jsonl" \
            -x "server/.composebridge-state/failures.json"

          # Prepare Documentation bundle
          cp README.md dist/docs/ 2>/dev/null || true
          cp README_AR.md dist/docs/ 2>/dev/null || true
          cp LIMITATIONS.md dist/docs/ 2>/dev/null || true
          cp CHANGELOG.md dist/docs/ 2>/dev/null || true
          cp LICENSE dist/docs/ 2>/dev/null || true

          # Create AllInOne ZIP bundle
          cd dist
          zip -r "ComposeBridge-${TAG_NAME}-AllInOne.zip" \
            *.zip \
            *.aar \
            docs/ \
            -x "ComposeBridge-${TAG_NAME}-AllInOne.zip"
          cd ..

          echo "Release contents ready in dist/:"
          ls -la dist/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.aar
